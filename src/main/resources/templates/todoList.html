<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title >ToDo List</title>
<link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
	<form th:action="@{/}" method="post" th:object="${todoQuery}">
		<div style="display: flex">
			<table border="1">
				<tr>
					<th th:text=#{m.title}></th>
					<th th:text=#{m.importance}></th>
					<th th:text=#{m.urgency}></th>
					<th th:text=#{m.deadline}></th>
					<th th:text=#{m.done}></th>
				</tr>
			
				<tr>
					<td>
						<input type="text" name="title" size="40" th:value="*{title}">
					</td>
					<td>
						<select name="importance">
							<option value="-1" th:field="*{importance}" th:text=#{notchooes}></option>
							<option value="1" th:field="*{importance}" th:text=#{high}></option>
							<option value="0" th:field="*{importance}" th:text=#{low}></option>
						</select>
					</td>
					<td>
						<select name="urgency">
							<option value="-1" th:field="*{urgency}" th:text=#{notchooes}></option>
							<option value="1" th:field="*{urgency}" th:text=#{high}></option>
							<option value="0" th:field="*{urgency}" th:text=#{low}></option>
						</select>
					</td>
					<td>
						<input type="text" name="deadlineFrom" th:value="*{deadlineFrom}" size="10" placeholder="yyyy-mm-dd">
						～
						<input type="text" name="deadlineTo" th:value="*{deadlineTo}" size="10" placeholder="yyyy-mm-dd">
					</td>
					<td>
						<input type="checkbox" value="Y" th:field="*{done}" th:text=#{m.done}>
					</td>
				</tr>
			</table>
			<button type="submit" th:formaction="@{/todo/query}" th:text=#{serach}></button>
		</div>
		<div th:if="${#fields.hasErrors('deadlineFrom')}" th:errors="*{deadlineFrom}" th:errorclass="red"></div>
		<div th:if="${#fields.hasErrors('deadlineTo')}" th:errors="*{deadlineTo}" th:errorclass="red"></div>
		<hr>
		<button type="submit"  th:formaction="@{/todo/create/form}" th:text=#{newregist}></button>
		<button type="submit" th:formaction="@{/todo/deleteselection(page=${todoPage.number})}" th:text=#{select.Delete}></button>
	
	<table border="1">
		<tr>
			<th th:text=#{m.check}></th>
			<th th:text=#{m.id}></th>
			<th th:text=#{m.title}></th>
			<th th:text=#{m.importance}></th>
			<th th:text=#{m.urgency}></th>
			<th th:text=#{m.deadline}></th>
			<th th:text=#{m.done}></th>
		</tr>
		<tr th:each="todo:${todoList}">
			<td><input type="checkbox" name="checkDelete" th:value="${todo.id}"></td>
			<td th:text="${todo.id}"></td>
			<td><a th:href="@{/todo/__${todo.id}__(page=${todoPage.number})}" th:text="${todo.title}"></a></td>
			<td th:text="${todo.importance == 1} ? #{m.threeStar}:#{m.oneStar}"></td>
			<td th:text="${todo.urgency == 1} ? #{m.threeStar}:#{m.oneStar}"></td>
			<td th:text="${todo.deadline}"></td>
			<td th:text="${todo.done == 'Y' ? '完了':''}"></td>
		</tr>
	</table>
	</form>
	<div th:if="${todoList != null && #lists.size(todoList) != 0}">
		<span th:text="|${todoPage.getNumber()+1}/${todoPage.getTotalPages()}ページを表示中|">
		</span>
		<ul id="nav">
			<li>
				<span th:if="${todoPage.isFirst()}" th:text=#{before}></span>
				<a th:unless="${todoPage.isFirst()}"
					th:href="@{/todo/query(page=${todoPage.getNumber()-1})}"  th:text=#{before}></a>
			</li>
			
			<li th:each="i:${#numbers.sequence(0,todoPage.getTotalPages()-1)}"
				th:if="${i >=todoPage.getNumber()-2 and i <= todoPage.getNumber()+2}">
				<span th:if="${i==todoPage.getNumber()}"th:text="${i+1}"></span>
					<a th:if="${i != todoPage.getNumber()}"
						th:href="@{/todo/query(page=${i})}" th:text="${i+1}"></a>
			</li>
			
			<li>
				<span th:if="${todoPage.isLast()}"  th:text=#{after}></span>
				<a th:unless="${todoPage.isLast()}"
					th:href="@{/todo/query(page = (${todoPage.getNumber()+1}))}" th:text=#{after}></a>
			</li>
		</ul>
	</div>

</body>
</html>
