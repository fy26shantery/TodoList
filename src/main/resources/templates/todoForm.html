<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{label.todo.list}">ToDo List</title>
  <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
  <form th:action="@{/}" method="post" th:object="${todoData}">
    <table>
      <tr>
        <th th:text="#{label.id}">id</th>
        <td>
          <span th:text="*{id}"></span>
          <input type="hidden" th:field="*{id}">
        </td>
      </tr>
      <tr>
        <th th:text="#{label.title}">件名</th>
        <td>
          <input type="text" name="title" size="40" th:value="*{title}">
          <!-- 自動的に properties の NotBlank.todoData.title 等が表示されます -->
          <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" th:errorclass="red"></div>
        </td>
      </tr>
      <tr>
        <th th:text="#{label.importance}">重要度</th>
        <td>
          <label>
            <input type="radio" value="1" th:field="*{importance}">
            <span th:text="#{label.high}">高</span>
          </label>
          <label>
            <input type="radio" value="0" th:field="*{importance}">
            <span th:text="#{label.low}">低</span>
          </label>
          <div th:if="${#fields.hasErrors('importance')}" th:errors="*{importance}" th:errorclass="red"></div>
        </td>
      </tr>
      <tr>
        <th th:text="#{label.urgency}">緊急度</th>
        <td>
          <select name="urgency">
            <option value="-1" th:field="*{urgency}" th:text="#{label.select.prompt}">選択してください</option>
            <option value="1" th:field="*{urgency}" th:text="#{label.high}">高</option>
            <option value="0" th:field="*{urgency}" th:text="#{label.low}">低</option>
          </select>
          <div th:if="${#fields.hasErrors('urgency')}" th:errors="*{urgency}" th:errorclass="red"></div>
        </td>
      </tr>
      <tr>
        <th th:text="#{label.deadline}">期限</th>
        <td>
          <input type="text" name="deadline" th:value="*{deadline}" placeholder="yyyy-mm-dd">
          <div th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}" th:errorclass="red"></div>
        </td>
      </tr>
      <tr>
        <th th:text="#{label.check}">チェック</th>
        <td>
          <label>
            <input type="checkbox" value="Y" th:field="*{done}">
            <span th:text="#{label.done.true}">完了</span>
          </label>
          <input type="hidden" name="!done" value="N" />
        </td>
      </tr>
    </table>
    
    <div th:if="${session.mode == 'update'}">
      <button type="submit" th:formaction="@{/todo/update}" th:text="#{button.update}">更新</button>
      <button type="submit" th:formaction="@{/todo/delete}" th:text="#{button.delete}">削除</button>
      <button type="submit" th:formaction="@{/todo/cancel}" th:text="#{button.cancel}">キャンセル</button>
    </div>
    <div th:unless="${session.mode == 'update'}">
      <button type="submit" th:formaction="@{/todo/create}" th:text="#{button.register}">登録</button>
      <button type="submit" th:formaction="@{/todo/cancel}" th:text="#{button.cancel}">キャンセル</button>
    </div>
  </form>
</body>
</html>
