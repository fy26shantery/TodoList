<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ToDo List</title>

	<link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>


	<form th:action="@{/}" method="post" th:object="${todoData}">
		<table>
			<tr>
				<th th:text="#{todo.id}"></th>
				<td>
					<span th:text="*{id}"></span>
					<input type="hidden" th:field="*{id}">
				</td>
			</tr>

			<tr>
				<th th:text="#{todo.title}"></th>
				<td>
					<input type="text" name="title" size="40" th:value="*{title}">
					<div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" th:errorclass="red"></div>
				</td>

			</tr>

			<tr>
				<th th:text="#{todo.importance}"></th>
				<td>
					<input type="radio" value="1" th:field="*{importance}" th:text="#{todo.hight}">
					<input type="radio" value="0" th:field="*{importance}" th:text="#{todo.low}">
					<div th:if="${#fields.hasErrors('importance')}" th:errors="*{importance}" th:errorclass="red"></div>

				</td>
			</tr>

			<tr>
				<th th:text="#{todo.urgency}"></th>
				<td>
					<select name="urgency">
						<option value="-1" th:field="*{urgency}" th:text="#{todo.select}"></option>
						<option value="1" th:field="*{urgency}" th:text="#{todo.hight}"></option>
						<option value="0" th:field="*{urgency}" th:text="#{todo.low}"></option>
					</select>
					<div th:if="${#fields.hasErrors('urgency')}" th:errors="*{urgency}" th:errorclass="red"></div>
				</td>
			</tr>
			<tr>
				<th th:text="#{todo.deadline}"></th>
				<td>
					<input type="text" name="deadline" th:value="*{deadline}" placeholder="yyyy-mm-dd">
					<div th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}" th:errorclass="red"></div>
				</td>
			</tr>
			<tr>
				<th th:text="#{todo.check}"></th>
				<td>
					<input type="checkbox" value="Y" th:field="*{done}" th:text="#{todo.done}">
					<input type="hidden" name="!done" value="N" />
				</td>
			</tr>


		</table>
		
		<div th:if="${session.mode == 'update'}">
			<button type="submit" th:formaction="@{/todo/update}" th:text="#{todo.update}"></button>
			<button type="submit" th:formaction="@{/todo/delete}" th:text="#{todo.delete}"></button>
			<button type="submit" th:formaction="@{/todo/cancel}" th:text="#{todo.cancel}"></button>
			
		</div>
		
		<div th:unless="${session.mode == 'update'}">
			<button type="submit" th:formaction="@{/todo/create/do}" th:text="#{todo.touroku}"></button>
			<button type="submit" th:formaction="@{/todo/cancel}" th:text="#{todo.cancel}"></button>

		</div>
		

	</form>

</body>

</html>
